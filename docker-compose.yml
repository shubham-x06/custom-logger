version: '3.8'
services:
  logger-server:
    build: .
    ports:
      - "8080:8080"
      - "9090:9090"
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY}
    volumes:
      - ./logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/"]
      interval: 30s
      timeout: 5s
      retries: 3
